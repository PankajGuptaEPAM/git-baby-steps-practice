services:

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: weekly_status
      POSTGRES_USER: weekly_status
      POSTGRES_PASSWORD: weekly_status_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekly_status -d weekly_status"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://weekly_status:weekly_status_dev@database:5432/weekly_status
    ports:
      - "3000:3000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
